name: FileNexus CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: filenexus-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-build:
    name: Backend - Java 21 compile/package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/filenexus
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/filenexus/pom.xml

      - name: Compile and package backend
        run: mvn --batch-mode --no-transfer-progress -DskipTests package

  frontend-build:
    name: Frontend - React production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  scanner-check:
    name: Scanner - Python dependency and syntax check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scanner
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scanner/requirements.txt

      - name: Install scanner dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python source
        run: python -m compileall -q app
