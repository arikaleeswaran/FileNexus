
spring.application.name=filenexus

# Server
server.port=8080

# PostgreSQL Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:55432/filenexus}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:admin123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never


# File validation configuration
filenexus.validation.max-file-size=10MB
filenexus.validation.allowed-extensions=pdf,png,jpg,jpeg,docx,txt

# Multipart upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB


# AWS S3 Configuration
filenexus.aws.region=ap-south-1
filenexus.aws.s3.quarantine-bucket=filenexus-quarantine-143
filenexus.aws.s3.clean-bucket=filenexus-clean-143


# AWS SQS configuration
filenexus.aws.sqs.scan-queue-url=${SQS_SCAN_QUEUE_URL}


# JWT Configuration
filenexus.jwt.secret=${JWT_SECRET}
filenexus.jwt.expiration-ms=28800000
